services:
  erp-car-backend:
    build:
      context: ./
      dockerfile: ./Dockerfile
    image: erp-car/php-8.3
    container_name: erp-car-app
    volumes:
      - .:/var/www/html
    ports:
      - "8085:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - erp-car-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  erp-car-network:
    driver: bridge
